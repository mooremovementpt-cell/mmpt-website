<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for reaching out | Moore Movement Personal Training</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky: #BDE9FB;
    --sky-soft: #E3F6FD;
    --navy: #281A39;
    --navy-soft: #5C5270;
    --accent-dark: #1C7FB8;
    --shadow-sm: 0 8px 20px rgba(40,26,57,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Quicksand', sans-serif; color:var(--navy);
    background:linear-gradient(180deg, var(--sky) 0%, var(--sky-soft) 100%);
    text-align:center; padding:40px 24px;
  }
  .card{ max-width:480px; }
  .logo{ height:64px; margin-bottom:32px; }
  h1{ font-family:'Baloo 2', sans-serif; font-size:34px; margin:0 0 16px; }
  p{ font-size:16.5px; color:var(--navy-soft); line-height:1.7; margin:0 0 32px; }
  a.btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--navy); color:#fff; text-decoration:none;
    padding:16px 32px; font-weight:700; font-size:15.5px; box-shadow:var(--shadow-sm);
    transition:background .2s, transform .2s;
  }
  a.btn:hover{ background:var(--accent-dark); transform:translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo.png" alt="Moore Movement Personal Training logo">
    <h1>Thanks &mdash; message sent!</h1>
    <p>Your message has landed with Noah. He replies personally, usually within a day or two &mdash; talk soon.</p>
    <a class="btn" href="/index.html">Back to the site</a>
  </div>
</body>
</html>
